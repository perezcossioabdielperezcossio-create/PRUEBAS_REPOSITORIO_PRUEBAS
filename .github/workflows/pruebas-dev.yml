name: CI pruebas automatizadas en dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  tests_app:
    name: Ejecutar pruebas en Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar el entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar las pruebas (Unit, Integracion, E2E)
        run: |
          echo "Empezando con pruebas de python"
          python -m pytest --rootdir . -s

      - name: Reporte final
        run: echo "Pruebas aprobadas, verifique resultado"

